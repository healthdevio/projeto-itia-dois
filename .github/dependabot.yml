version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/chat-back
      - /apps/chat-omnia
      - /apps/packages/knowledge
    target-branch: develop
    schedule:
      interval: cron
      cronjob: '0 9 * * 1'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Precisa vir antes de development-minor-patch: o primeiro grupo que casa vence.
      # Mantém vitest e @vitest/* na mesma versão (o coverage exige peer exato).
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/docker
    schedule:
      interval: cron
      cronjob: '0 9 * * 1'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: '0 9 * * 1'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: 'ci(deps)'
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

# Dockerfiles use node:24-alpine (major pinned); Dependabot tracks this tag.
