name: CI (Continuous Integration)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (chat-omnia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-omnia/package-lock.json
      - name: Instalar dependências
        working-directory: apps/chat-omnia
        run: npm ci
      - name: Verificar TypeScript
        working-directory: apps/chat-omnia
        run: npm run typecheck
      - name: Verificar ESLint
        working-directory: apps/chat-omnia
        run: npm run lint
      - name: Gerar build
        working-directory: apps/chat-omnia
        run: npm run build
      - name: Verificar que o build não está versionado
        run: |
          if git ls-files --error-unmatch apps/chat-omnia/dist >/dev/null 2>&1; then
            echo "::error::apps/chat-omnia/dist está versionado. Remova do git."
            exit 1
          fi

  backend:
    name: Backend (chat-back)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-back/package-lock.json
      - name: Instalar dependências
        working-directory: apps/chat-back
        run: npm ci
      - name: Verificar TypeScript
        working-directory: apps/chat-back
        run: npm run typecheck
      - name: Rodar testes
        working-directory: apps/chat-back
        run: npm test
      - name: Gerar build
        working-directory: apps/chat-back
        run: npm run build

  format:
    if: github.event_name == 'pull_request'
    name: Formatação (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar formatação Prettier
        run: npm run format
      - name: Criar patch das alterações
        id: format
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --binary > format.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publicar patch de formatação
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prettier-format-patch
          path: format.patch
          if-no-files-found: error
          retention-days: 1

  format-commit:
    if: >-
      github.event_name == 'pull_request' &&
      needs.format.outputs.changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Commit da formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [format]
    permissions:
      contents: write
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Baixar patch de formatação
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prettier-format-patch
      - name: Aplicar e enviar formatação
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git apply --index format.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "style: auto-format by Prettier"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$PR_HEAD_REF"

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.4.1
      - name: Construir imagem do Backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/docker/Dockerfile.core
          load: true
          tags: local/chat-core:${{ github.sha }}
      - name: Construir imagem da interface
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/docker/Dockerfile.web
          load: true
          tags: local/chat-web:${{ github.sha }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [frontend, backend, format, format-commit, images]
    permissions: {}
    steps:
      - name: Validar jobs obrigatórios
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          FORMAT_CHANGED: ${{ needs.format.outputs.changed }}
          FORMAT_COMMIT_RESULT: ${{ needs.format-commit.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$FRONTEND_RESULT" != success || \
                "$BACKEND_RESULT" != success || \
                "$IMAGES_RESULT" != success ]]; then
            echo "Um ou mais jobs obrigatórios falharam ou foram cancelados."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$FORMAT_RESULT" != success ]]; then
              echo "A aplicação da formatação do pull request não foi concluída com sucesso."
              exit 1
            fi
            if [[ "$FORMAT_CHANGED" == true && "$FORMAT_COMMIT_RESULT" != success ]]; then
              if [[ "$PR_HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                echo "A formatação foi aplicada, mas PRs de forks não podem receber commit automático. Aplique o patch manualmente."
              else
                echo "A formatação mudou arquivos, mas o commit automático não foi concluído."
              fi
              exit 1
            fi
          fi
          {
            echo "### CI OK"
            echo "Este check cobre frontend, backend e imagens Docker; em pull requests, exige que a formatação esteja aplicada e enviada."
          } >> "$GITHUB_STEP_SUMMARY"
