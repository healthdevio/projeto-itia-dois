name: CI (Continuous Integration)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs separados por aplicativo, para que uma falha nǜo esconda o resultado dos
  # outros. Rodam em paralelo.

  frontend:
    name: Frontend (chat-omia)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-omnia/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-omnia
        run: npm ci

      - name: Verificar TypeScript
        working-directory: apps/chat-omia
        run: npm run typecheck

      - name: Verificar ESLint
        working-directory: apps/chat-omia
        run: npm run lint

      - name: Gerar build
        working-directory: apps/chat-omia
        run: npm run build

      - name: Verificar build nǜo-git-ignored
        # Um dist versionado quebraria o npm ci do servidor.
        run: |-
          if git ls-files --error-unmatch apps/chat-omnia/dist >/dev/null 2>&1; then
            echo "::error::apps/chat-omnia/dist estǭ versionado. Remova do git."
            exit 1
          fi

  core:
    name: Core (chat-core)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-core/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-core
        run: npm ci

      # typecheck roda src e test: tsx nǜo checa tipos.
      - name: Verificar TypeScript
        working-directory: apps/chat-core
        run: npm run typecheck

      - name: Rodar testes
        working-directory: apps/chat-core
        run: npm test

      - name: Gerar build
        working-directory: apps/chat-core
        run: npm run build

  format:
    name: Formatação (Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Auto-fix: corrige problemas de formatação automaticamente
      - name: Executar npm run format
        run: npm run format

      # Verificar formatação (fail se houver problemas restantes)
      - name: Verificar formatação
        run: npm run format:check

  # Confere que as imagens construem. O CD as constr��i de novo, do mesmo
  # commit: um Dockerfile quebrado nǜo pode ser descoberto no deploy.
  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [frontend, core, format]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem do Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          push: false
          sbom: false
          provenance: false

      - name: Construir imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          push: false
          sbom: false
          provenance: false
