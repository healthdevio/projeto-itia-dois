# Valida o repositório antes de o CD publicar qualquer imagem.
#
# ```
# PR ou push ──> 4 jobs em paralelo ──> tudo verde? ──> CD
# ```
#
# `main` entra porque o PR develop → main também passa por aqui. Ver docs/ci_cd/.

name: CI (Continuous Integration)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs separados por app, para que uma falha não esconda o resultado dos
  # outros. Rodam em paralelo.

  frontend:
    name: Frontend (chat-omnia)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-omnia/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-omnia
        run: npm ci

      - name: Verificar TypeScript
        working-directory: apps/chat-omnia
        run: npm run typecheck

      - name: Verificar ESLint
        working-directory: apps/chat-omnia
        run: npm run lint

      - name: Gerar build
        working-directory: apps/chat-omnia
        run: npm run build

      - name: Verificar build não-git-ignored
        # Um dist versionado quebraria o npm ci do servidor.
        run: |
          if git ls-files --error-unmatch apps/chat-omnia/dist >/dev/null 2>&1; then
            echo "::error::apps/chat-omnia/dist está versionado. Remova do git."
            exit 1
          fi

  core:
    name: Core (chat-core)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-core/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-core
        run: npm ci

      # typecheck roda src e test: tsx não checa tipos.
      - name: Verificar TypeScript
        working-directory: apps/chat-core
        run: npm run typecheck

      - name: Rodar testes
        working-directory: apps/chat-core
        run: npm test

      - name: Gerar build
        working-directory: apps/chat-core
        run: npm run build

  format:
    name: Formatação (prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Na raiz: o prettier tem um conjunto de regras para o repositório inteiro.
      # Em ubuntu a checagem é sobre LF, que é o que o .gitattributes garante.
      - name: Verificar formatação
        run: npm run format:check

  # Confere que as imagens construem. O CD as constrói de novo, do mesmo
  # commit: um Dockerfile quebrado não pode ser descoberto no deploy.
  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [frontend, core, format]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem do Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
