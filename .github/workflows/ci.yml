name: CI (Continuous Integration)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (chat-omnia)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-omnia/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-omnia
        run: npm ci
        shell: bash

      - name: Verificar TypeScript
        working-directory: apps/chat-omnia
        run: npm run typecheck

      - name: Verificar ESLint
        working-directory: apps/chat-omnia
        run: npm run lint

      - name: Gerar build
        working-directory: apps/chat-omnia
        run: npm run build

      - name: Verificar build nǜo-git-ignored

        run: |-
          if git ls-files --error-unmatch apps/chat-omnia/dist >/dev/null 2>&1; then
            echo "::error::apps/chat-omnia/dist estǭ versionado. Remova do git."
            exit 1
          fi

  backend:
    name: Backend (chat-back)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-back/package-lock.json

      - name: Instalar dependências
        working-directory: apps/chat-back
        run: npm ci

      - name: Verificar TypeScript
        working-directory: apps/chat-back
        run: npm run typecheck

      - name: Rodar testes
        working-directory: apps/chat-back
        run: npm test

      - name: Gerar build
        working-directory: apps/chat-back
        run: npm run build

  format:
    name: Formatação (Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [frontend, backend, format]

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem do Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          load: true
          tags: local/chat-core:${{ github.sha }}

      - name: Verificar vulnerabilidades da imagem do Core
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/chat-core:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Construir imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          load: true
          tags: local/chat-web:${{ github.sha }}

      - name: Verificar vulnerabilidades da imagem web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/chat-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
