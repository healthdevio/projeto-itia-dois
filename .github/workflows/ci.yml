name: CI (Continuous Integration)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (chat-omnia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-omnia/package-lock.json
      - name: Instalar dependências
        working-directory: apps/chat-omnia
        run: npm ci
      - name: Verificar TypeScript
        working-directory: apps/chat-omnia
        run: npm run typecheck
      - name: Verificar ESLint
        working-directory: apps/chat-omnia
        run: npm run lint
      - name: Gerar build
        working-directory: apps/chat-omnia
        run: npm run build
      - name: Verificar que o build não está versionado
        run: |
          if git ls-files --error-unmatch apps/chat-omnia/dist >/dev/null 2>&1; then
            echo "::error::apps/chat-omnia/dist está versionado. Remova do git."
            exit 1
          fi

  backend:
    name: Backend (chat-back)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat-back/package-lock.json
      - name: Instalar dependências
        working-directory: apps/chat-back
        run: npm ci
      - name: Verificar TypeScript
        working-directory: apps/chat-back
        run: npm run typecheck
      - name: Rodar testes
        working-directory: apps/chat-back
        run: npm test
      - name: Gerar build
        working-directory: apps/chat-back
        run: npm run build

  format:
    if: github.event_name == 'pull_request'
    name: Formatação (Prettier)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necessário para o git push automático
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # necessário para autenticar o git push
          ref: ${{ github.head_ref }}  # garante checkout na branch do PR

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar formatação Prettier (--write)
        run: npm run format
      - name: Commit das correções
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if [ -n "$(git diff --stat)" ]; then
            git commit -m "style: auto-format by Prettier [skip ci]"
            git push
          fi

      - name: Aplicar formatação Prettier (--write)
        run: npm run format
      - name: Commit das correções
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if [ -n "$(git diff --stat)" ]; then
            git add -A
            git commit -m "style: auto-format by Prettier [skip ci]"
            git push
          else
            echo "Nenhuma correção de formatação necessária."
          fi

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend, format]
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem do Core
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/docker/Dockerfile.core
          load: true
          tags: local/chat-core:${{ github.sha }}
      - name: Construir imagem da interface
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/docker/Dockerfile.web
          load: true
          tags: local/chat-web:${{ github.sha }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [frontend, backend, format, images]
    permissions: {}
    steps:
      - name: Validar jobs obrigatórios
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          if [[ "$FRONTEND_RESULT" == failure || "$FRONTEND_RESULT" == cancelled || \
                "$BACKEND_RESULT" == failure || "$BACKEND_RESULT" == cancelled || \
                "$FORMAT_RESULT" == failure || "$FORMAT_RESULT" == cancelled || \
                "$IMAGES_RESULT" == failure || "$IMAGES_RESULT" == cancelled ]]; then
            echo "Um ou mais jobs obrigatórios falharam ou foram cancelados."
            exit 1
          fi
          {
            echo "### CI OK"
            echo "Este check cobre frontend, backend, formatação e imagens Docker."
            echo "Workflow Lint é check separado com falha informativa; Semgrep é informativo."
            echo "Com o ruleset inativo, nenhum check bloqueia o merge no GitHub, mesmo quando falha."
          } >> "$GITHUB_STEP_SUMMARY"