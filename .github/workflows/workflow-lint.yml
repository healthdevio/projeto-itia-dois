name: Workflow Lint

on:
  pull_request:
    paths: ['.github/**']
  push:
    paths: ['.github/**']

permissions: {}

jobs:
  actionlint:
    name: actionlint and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -shellcheck "$(command -v shellcheck)"

  zizmor:
    name: zizmor security lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor
      - name: Run zizmor
        run: zizmor --no-online-audits --min-severity medium .github/workflows
