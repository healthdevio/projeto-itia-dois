name: CD (Continuous Delivery)

on:
  workflow_run:
    workflows: ['CI (Continuous Integration)']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    name: Build and Push approved commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit approved by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to PW2C Private Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.grupopw2c.com.br
          username: ${{ secrets.PW2C_REGISTRY_USERNAME }}
          password: ${{ secrets.PW2C_REGISTRY_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.back
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-back:latest
            registry.cloud.grupopw2c.com.br/chat-back:${{ github.event.workflow_run.head_sha }}
            registry.cloud.grupopw2c.com.br/chat-back:${{ github.event.workflow_run.head_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-web:latest
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.event.workflow_run.head_sha }}
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.event.workflow_run.head_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publication summary
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            echo "### Published CI-approved commit"
            echo
            echo "- branch: \`${BRANCH}\`"
            echo "- commit: \`${SHA}\`"
            echo "- chat-back: \`registry.cloud.grupopw2c.com.br/chat-back:${BRANCH}\`"
            echo "- chat-web: \`registry.cloud.grupopw2c.com.br/chat-web:${BRANCH}\`"
            echo
            echo "Images are published with SBOM and provenance. Update the Portainer stack manually using these immutable SHA tags."
          } >> "$GITHUB_STEP_SUMMARY"
