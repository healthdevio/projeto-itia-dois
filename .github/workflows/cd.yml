# Publica as imagens no ghcr.io depois que a CI passa, e implanta na VM.
#
# ```
# push ──> CI (ci.yml) ──> CD (cd.yml) ──> publicar ──> deploy
# ```
#
# develop vira homologação, main vira produção. Ver docs/ci_cd/.

name: CD (Continuous Delivery)

on:
  workflow_run:
    # Nome exato do `name:` de ci.yml. Se mudar lá, para de disparar sem erro.
    workflows: ['CI (Continuous Integration)']
    types: [completed]

  # Cobre o intervalo entre o cd.yml entrar na develop e chegar na main, em que
  # o workflow_run ainda não enxerga este arquivo.
  workflow_dispatch:

# `packages: write` habilita o push no ghcr.io. O GITHUB_TOKEN já existe.
permissions:
  contents: read
  packages: write

# Deploy em andamento não é cancelado: em produção isso pode deixar a imagem
# anterior sem retorno no registry.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build:
    name: Construir e publicar
    runs-on: ubuntu-latest

    # `steps.*.outputs` não atravessa jobs — o que o job de deploy precisa
    # precisa ser declarado aqui.
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      image-core: ${{ steps.images.outputs.core }}
      image-web: ${{ steps.images.outputs.web }}

    # `workflow_run` não aceita filtro de branch no `on:`. O primeiro termo
    # cobre o disparo manual, que não tem `workflow_run`.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'develop' ||
        github.event.workflow_run.head_branch == 'main'))

    steps:
      # Os gatilhos trazem o commit de lugares diferentes; sem normalizar, o
      # disparo manual cairia na branch padrão e publicaria o código errado.
      - name: Resolver commit e branch
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Resumo do que será publicado
        run: |
          echo "commit: ${{ steps.ctx.outputs.sha }}"
          echo "tag:    ${{ steps.ctx.outputs.short }}"
          echo "branch: ${{ steps.ctx.outputs.branch }}"

      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags explícitas por build. Um gerador único de tags seria compartilhado
      # pelos dois builds, e cada um publicaria nas duas imagens: o `chat-core`
      # acabaria contendo a imagem do nginx, com `node: not found` no
      # migrate-core.
      #
      # Tag por commit, nunca `latest`: `latest` se move, e sem número de versão
      # não há como reverter. A tag de branch é só para inspeção.
      - name: Publicar a imagem do Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-core:${{ steps.ctx.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-core:${{ steps.ctx.outputs.branch }}
          labels: |
            org.opencontainers.image.title=chat-core
            org.opencontainers.image.revision=${{ steps.ctx.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar a imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-web:${{ steps.ctx.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-web:${{ steps.ctx.outputs.branch }}
          labels: |
            org.opencontainers.image.title=chat-web
            org.opencontainers.image.revision=${{ steps.ctx.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Referência completa que o deploy.sh grava no .env da VM.
      - name: Montar as referências
        id: images
        run: |
          echo "core=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-core:${{ steps.ctx.outputs.short }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-web:${{ steps.ctx.outputs.short }}" >> "$GITHUB_OUTPUT"

      - name: O que foi publicado
        run: |
          echo "branch: ${{ steps.ctx.outputs.branch }}"
          echo "commit: ${{ steps.ctx.outputs.sha }}"
          echo
          echo "${{ steps.images.outputs.core }}"
          echo "${{ steps.images.outputs.web }}"

  # Dois jobs e não uma matriz: a diferença entre os ambientes é o que importa,
  # e uma matriz a esconderia num `include:`. Os arquivos vão por scp a cada
  # deploy, para o repositório continuar sendo a fonte da verdade.

  deploy-homolog:
    name: Deploy homologação
    needs: build
    runs-on: ubuntu-latest
    environment: homolog

    if: needs.build.outputs.branch == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      # Sem este `ls`, um `source` que não resolve vira um "tar: empty archive"
      # sem dizer qual caminho faltou.
      - name: Conferir os arquivos que serão enviados
        run: ls -la apps/docker/docker-compose.deploy.yml apps/docker/deploy.sh

      # `source` numa linha: em bloco `|` o item final vazio quebra o glob.
      # `strip_components` remove apps/docker/, senão o script executado seria a
      # cópia antiga que está na raiz.
      - name: Enviar o compose e o script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/docker/docker-compose.deploy.yml,apps/docker/deploy.sh
          strip_components: 2
          target: /srv/omnia/homolog

      # `env:` define no runner, `envs:` diz o que atravessa o SSH. Sem o
      # `envs` o deploy.sh aborta com "informe IMAGE_CORE".
      - name: Aplicar
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_CORE: ${{ needs.build.outputs.image-core }}
          IMAGE_WEB: ${{ needs.build.outputs.image-web }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: 'IMAGE_CORE,IMAGE_WEB'
          script: |
            chmod +x /srv/omnia/homolog/deploy.sh
            cd /srv/omnia/homolog
            ./deploy.sh /srv/omnia/homolog

  deploy-prod:
    name: Deploy produção
    needs: build
    runs-on: ubuntu-latest

    # O environment production aceita só `main`, então uma branch errada é
    # barrada pelo próprio GitHub antes deste job rodar.
    environment: production

    if: needs.build.outputs.branch == 'main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Conferir os arquivos que serão enviados
        run: ls -la apps/docker/docker-compose.deploy.yml apps/docker/deploy.sh

      - name: Enviar o compose e o script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/docker/docker-compose.deploy.yml,apps/docker/deploy.sh
          strip_components: 2
          target: /srv/omnia/prod

      - name: Aplicar
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_CORE: ${{ needs.build.outputs.image-core }}
          IMAGE_WEB: ${{ needs.build.outputs.image-web }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: 'IMAGE_CORE,IMAGE_WEB'
          script: |
            chmod +x /srv/omnia/prod/deploy.sh
            cd /srv/omnia/prod
            ./deploy.sh /srv/omnia/prod
