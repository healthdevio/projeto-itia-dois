name: CD (Continuous Delivery)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to PW2C Private Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.grupopw2c.com.br
          username: ${{ secrets.PW2C_REGISTRY_USERNAME }}
          password: ${{ secrets.PW2C_REGISTRY_PASSWORD }}

      # Tags explicitas por build. Um gerador unico de tags seria compartilhado
      # pelos dois builds, e cada um publicaria nas duas imagens: o `chat-core`
      # acabaria contendo a imagem do nginx, com `node: not found` no boot.
      #
      # A tag de branch existe porque a stack e redesenhada a cada deploy. A tag
      # de commit continua sendo a via de reverte: apontar OMNIA_CORE_IMAGE e
      # OMNIA_WEB_IMAGE no Portainer para o sha de um deploy anterior.
      - name: Build and Push Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-core:latest
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.sha }}
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-web:latest
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.sha }}
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Build $BRANCH"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- chat-core: \`registry.cloud.grupopw2c.com.br/chat-core:${BRANCH}\`"
            echo "- chat-web: \`registry.cloud.grupopw2c.com.br/chat-web:${BRANCH}\`"
            echo
            echo "Publicadas as imagens. Atualize a stack manualmente no Portainer."
            echo "1. Stacks -> omnia -> Environment variables"
            echo "2. Atualize OMNIA_CORE_IMAGE e OMNIA_WEB_IMAGE"
            echo "3. Update the stack com Repull image"
          } >> "$GITHUB_STEP_SUMMARY"
