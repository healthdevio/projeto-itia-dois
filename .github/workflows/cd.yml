# ```
# push ──> CI (ci.yml) ──> CD (cd.yml) ──> publicar imagem ──> deploy na VM
# ```

# ## Este arquivo ainda não faz deploy
#
# Só o primeiro movimento: constrói e publica. O deploy na VM é o job `deploy`,
# que entra no próximo passo. Ver docs/estrutura/deploy.md.
#
# ## Duas formas de disparar
#
# `workflow_run`     automático, depois que a CI passa
# `workflow_dispatch` manual, pelo botão "Run workflow" na aba Actions
#
# O manual existe porque `workflow_run` só enxerga workflows que estão na branch
# padrão (`main`). Entre o merge do cd.yml na develop e o merge na main, o
# automático não dispara — e falha em silêncio, sem erro nenhum. O botão manual
# cobre esse intervalo.

name: CD (Continuous Delivery)

on:
  workflow_run:
    # Nome exato do workflow em ci.yml. Se o `name:` de lá mudar, este
    # workflow_run para de disparar — e sem erro visível.
    workflows: ['CI (Continuous Integration)']
    types: [completed]

  workflow_dispatch:

# `packages: write` é o que permite publicar no ghcr.io. Sem isso o `docker
# push` falha com "denied". O GITHUB_TOKEN é automático — não precisa criar.
permissions:
  contents: read
  packages: write

# Um deploy por vez. `cancel-in-progress: false` de propósito: em produção um
# deploy em andamento não pode ser cancelado no meio, porque a imagem antiga pode
# já ter saído do registry.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build:
    name: Construir e publicar
    runs-on: ubuntu-latest

    # `steps.*.outputs` só vale dentro do próprio job. O job de deploy precisa
    # saber a branch e as tags, então elas viram outputs do job.
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      sha: ${{ steps.ctx.outputs.sha }}
      image-core: ${{ steps.images.outputs.core }}
      image-web: ${{ steps.images.outputs.web }}

    # `workflow_run` não aceita filtro de branch no `on:`, então as condições
    # vêm todas aqui.
    #
    # O primeiro termo é o disparo manual, que não tem `workflow_run` e por isso
    # passaria pela checagem de baixo como branch vazia.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'develop' ||
        github.event.workflow_run.head_branch == 'main'))

    steps:
      # Os dois gatilhos trazem o commit em lugares diferentes:
      #   workflow_run      → event.workflow_run.head_sha
      #   workflow_dispatch → github.sha
      #
      # Sem este passo, o `if:` de cima passaria, mas o checkout cairia na
      # branch padrão e a imagem seria de outro código — sem erro no log.
      - name: Resolver commit e branch
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumo do que será publicado
        run: |
          echo "commit: ${{ steps.ctx.outputs.sha }}"
          echo "branch: ${{ steps.ctx.outputs.branch }}"

      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag por commit, nunca `latest`.
      #
      # `latest` é um ponteiro que se move: se um deploy der errado não há como
      # voltar, porque ele já aponta para outra imagem. Com o sha, o rollback é
      # `docker pull ghcr.io/healthdevio/chat-core:5f62538`.
      #
      # A tag com o nome da branch serve só para inspeção: mostra "o que está em
      # main" sem precisar saber o sha. O deploy usa sempre a tag do sha.
      - name: Calcular as tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-core
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-web
          tags: |
            type=sha,prefix=
            type=raw,value=${{ steps.ctx.outputs.branch }}

      - name: Publicar a imagem do Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar a imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Referência completa com a tag do commit. O `deploy.sh` recebe isto como
      # IMAGE_CORE e IMAGE_WEB e grava no .env da VM — é isso que faz o
      # `docker compose pull` na VM buscar exatamente a imagem deste commit.
      - name: Montar as referências
        id: images
        run: |
          echo "core=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-core:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chat-web:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: O que foi publicado
        run: |
          echo "branch:  ${{ steps.ctx.outputs.branch }}"
          echo "commit:  ${{ steps.ctx.outputs.sha }}"
          echo
          echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n'

  # Os dois jobs de deploy são idênticos exceto pelo diretório e pelo ambiente do
  # GitHub. Poderia ser um job só com matriz, mas a matriz esconde a diferença
  # entre homologação e produção num bloco `include:` difícil de ler, e aqui a
  # diferença é justamente o que importa.
  #
  # Os arquivos de deploy são enviados a cada deploy em vez de serem copiados à
  # mão: uma cópia na VM desatualizada é um compose diferente do repositório, e
  # o primeiro sintoma é um deploy que roda com a configuração antiga.

  deploy-homolog:
    name: Deploy homologação
    needs: build
    runs-on: ubuntu-latest
    environment: homolog

    if: needs.build.outputs.branch == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      # Diagnóstico do scp: se o `source` não resolver, o drone-scp falha com
      # "tar: empty archive" sem dizer qual caminho não existiu. Esta lista
      # transforma um erro opaco em um caminho visível.
      - name: Conferir os arquivos que serão enviados
        run: ls -la apps/docker/docker-compose.deploy.yml apps/docker/deploy.sh

      - name: Enviar o compose e o script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Uma linha separada por vírgula. O bloco `|` com quebra de linha
          # final vira um terceiro item vazio na lista, e o glob do tar não
          # resolve — daí o "empty archive".
          source: apps/docker/docker-compose.deploy.yml,apps/docker/deploy.sh
          # Sem isto o tar mantém a árvore: o arquivo cairia em
          # /srv/omnia/homolog/apps/docker/deploy.sh, e o script executado
          # continuaria sendo a cópia antiga que está na raiz.
          strip_components: 2
          target: /srv/omnia/homolog

      # `env:` define as variáveis no runner; `envs:` (dentro de `with:`) diz
      # quais delas atravessam o SSH. Sem o `envs`, a action não repassa
      # nada, e o deploy.sh aborta com "informe IMAGE_CORE".
      #
      # O parêntese do `envs` não é decorativo: sem ele a lista é lida como um
      # argumento só.
      - name: Aplicar
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_CORE: ${{ needs.build.outputs.image-core }}
          IMAGE_WEB: ${{ needs.build.outputs.image-web }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: 'IMAGE_CORE,IMAGE_WEB'
          script: |
            chmod +x /srv/omnia/homolog/deploy.sh
            cd /srv/omnia/homolog
            ./deploy.sh /srv/omnia/homolog

  deploy-prod:
    name: Deploy produção
    needs: build
    runs-on: ubuntu-latest

    # O ambiente `production` aceita apenas `main` (ver
    # docs/estrutura/config_github.md). Um deploy vindo de outra branch é
    # barrado pelo próprio GitHub antes deste job rodar.
    environment: production

    if: needs.build.outputs.branch == 'main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Conferir os arquivos que serão enviados
        run: ls -la apps/docker/docker-compose.deploy.yml apps/docker/deploy.sh

      - name: Enviar o compose e o script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/docker/docker-compose.deploy.yml,apps/docker/deploy.sh
          strip_components: 2
          target: /srv/omnia/prod

      - name: Aplicar
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_CORE: ${{ needs.build.outputs.image-core }}
          IMAGE_WEB: ${{ needs.build.outputs.image-web }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: 'IMAGE_CORE,IMAGE_WEB'
          script: |
            chmod +x /srv/omnia/prod/deploy.sh
            cd /srv/omnia/prod
            ./deploy.sh /srv/omnia/prod
