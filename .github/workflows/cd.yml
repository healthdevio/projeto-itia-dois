name: CD (Continuous Delivery)

on:
  workflow_run:
    workflows: ['CI (Continuous Integration)']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    name: Build and Push approved commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout commit approved by CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Login to PW2C Private Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: registry.cloud.grupopw2c.com.br
          username: ${{ secrets.PW2C_REGISTRY_USERNAME }}
          password: ${{ secrets.PW2C_REGISTRY_PASSWORD }}
      - name: Build backend candidate for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docker/Dockerfile.core
          platforms: linux/amd64
          load: true
          tags: local/chat-core:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
      - name: Scan backend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/chat-core:${{ github.event.workflow_run.head_sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build and Push Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docker/Dockerfile.core
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-core:latest
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.event.workflow_run.head_sha }}
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.event.workflow_run.head_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web candidate for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: local/chat-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
      - name: Scan web candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/chat-web:${{ github.event.workflow_run.head_sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build and Push Web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-web:latest
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.event.workflow_run.head_sha }}
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.event.workflow_run.head_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publication summary
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            echo "### Published CI-approved commit"
            echo
            echo "- branch: \`${BRANCH}\`"
            echo "- commit: \`${SHA}\`"
            echo "- chat-core: \`registry.cloud.grupopw2c.com.br/chat-core:${BRANCH}\`"
            echo "- chat-web: \`registry.cloud.grupopw2c.com.br/chat-web:${BRANCH}\`"
            echo
            echo "Images are published with SBOM and provenance. Portainer stack deployment remains opt-in."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Portainer stack
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: {}
    steps:
      - name: Trigger Portainer service webhooks
        env:
          PORTAINER_WEBHOOK_CORE: ${{ secrets.PORTAINER_WEBHOOK_CORE }}
          PORTAINER_WEBHOOK_WEB: ${{ secrets.PORTAINER_WEBHOOK_WEB }}
        run: |
          curl -fsS --retry 3 -X POST "$PORTAINER_WEBHOOK_CORE"
          curl -fsS --retry 3 -X POST "$PORTAINER_WEBHOOK_WEB"
      - name: Deployment summary
        run: |
          {
            echo "### Portainer redeploy triggered"
            echo
            echo "Dispatched Portainer service webhooks: core and web. The database service was not redeployed."
            echo "The stack uses :latest, so each webhook pulls the new image and restarts its service. If a service uses a SHA tag, update the stack before triggering this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

# Portainer Community Edition uses individual service webhooks here. The stack
# uses :latest, so each webhook pulls the new image and restarts that service.
# If the stack uses a SHA tag, update it before calling these webhooks.
