name: Dependabot Auto-merge

on:
  workflow_run:
    workflows:
      - 'CI (Continuous Integration)'
      - 'Workflow Security Audit'
      - 'CodeQL Analysis'
      - 'Dependency Review'
      - 'Gitleaks - Secret Scanning'
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       github.event.workflow_run.actor.login == 'app/dependabot') &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/'))
    name: Validate and merge eligible Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Validate PR, files, and required checks for the exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_BRANCH" == dependabot/npm_and_yarn/* ]]; then
            ALLOWED_GROUP=npm
          elif [[ "$HEAD_BRANCH" == dependabot/github_actions/* ]]; then
            ALLOWED_GROUP=github-actions
          else
            echo "Branch fora dos grupos permitidos; nenhum merge será feito."
            exit 0
          fi

          PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" |
            jq -r \
              --arg head_branch "$HEAD_BRANCH" \
              --arg head_sha "$HEAD_SHA" \
              '[.[] | select(
                .state == "open" and
                .base.ref == "develop" and
                .head.ref == $head_branch and
                .head.sha == $head_sha
              )] | if length == 1 then .[0].number else empty end')"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "Nenhum PR aberto único corresponde ao SHA e branch; nenhum merge será feito."
            exit 0
          fi

          PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author,baseRefName,headRefName,headRefOid,isDraft,mergeable,files)"

          if ! jq -e \
            --arg head_sha "$HEAD_SHA" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg group "$ALLOWED_GROUP" \
            '
              (.author.login == "dependabot[bot]" or .author.login == "app/dependabot") and
              .baseRefName == "develop" and
              .headRefName == $head_branch and
              .headRefOid == $head_sha and
              .isDraft == false and
              .mergeable == "MERGEABLE" and
              (.files | length) > 0 and
              (if ($group == "npm") then
                 all(.files[].path;
                   . == "package.json" or
                   endswith("/package.json") or
                   test("(^|/)(package-lock\\.json|npm-shrinkwrap\\.json|yarn\\.lock|pnpm-lock\\.yaml)$"))
               else
                 all(.files[].path; startswith(".github/workflows/"))
               end)
            ' <<< "$PR_JSON" >/dev/null; then
            echo "PR fora das condições seguras; nenhum merge será feito."
            exit 0
          fi

          require_successful_check() {
            local check_name="$1"
            local result
            if ! result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" --jq "[.check_runs[] | select(.name == \"$check_name\")] | sort_by(.started_at) | last | select(.status == \"completed\" and .conclusion == \"success\") | .conclusion")"; then
              echo "Falha ao consultar o check $check_name."
              return 2
            fi
            if [[ "$result" != "success" ]]; then
              echo "$check_name não está verde no head SHA do PR; nenhum merge será feito."
              return 1
            fi
          }

          for CHECK in "CI OK" "Dependency Review" "Gitleaks Scan" "CodeQL Analysis (javascript-typescript)"; do
            if ! require_successful_check "$CHECK"; then
              exit 0
            fi
          done

          if [[ "$ALLOWED_GROUP" == "github-actions" ]] &&
             ! require_successful_check "Audit Workflow Security"; then
            exit 0
          fi

          echo "PR #$PR_NUMBER validado: autor Dependabot, destino develop, grupo $ALLOWED_GROUP, arquivos permitidos e checks obrigatórios verdes em $HEAD_SHA."
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
