name: Deploy Chat Omnia (PW2C / Swarm)

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Um deploy so por vez: duas chamadas a API no mesmo instante fazem o Swarm
# aplicar a mesma stack duas vezes, e o rollback de uma derruba a imagem da outra.
concurrency:
  group: deploy-pw2c-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to PW2C Private Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.grupopw2c.com.br
          username: ${{ secrets.PW2C_REGISTRY_USERNAME }}
          password: ${{ secrets.PW2C_REGISTRY_PASSWORD }}

      # Tags explicitas por build. Um gerador unico de tags seria compartilhado
      # pelos dois builds, e cada um publicaria nas duas imagens: o `chat-core`
      # acabaria contendo a imagem do nginx, com `node: not found` no boot.
      #
      # A tag de branch existe porque a stack e redesenhada a cada deploy. A tag
      # de commit continua sendo a via de reverte: apontar OMNIA_CORE_IMAGE e
      # OMNIA_WEB_IMAGE no Portainer para o sha de um deploy anterior.
      - name: Build and Push Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.core
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-core:latest
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.sha }}
            registry.cloud.grupopw2c.com.br/chat-core:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile.web
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            registry.cloud.grupopw2c.com.br/chat-web:latest
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.sha }}
            registry.cloud.grupopw2c.com.br/chat-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ## Por que API e nao webhook
      #
      # Webhook de stack e Business Edition. Em Community Edition o botao de
      # webhook nao aparece na tela da stack -- e `POST /api/stacks/webhooks/{id}`
      # devolve 404, porque o endpoint nao existe na CE.
      #
      # A alternativa e a API com token de acesso, que existe nas duas edicoes.
      # Custo: precisa de PORTAINER_URL, PORTAINER_API_KEY, PORTAINER_STACK_ID e
      # PORTAINER_ENDPOINT_ID -- quatro secrets em vez de um.
      #
      # A chamada reenvia o conteudo atual da stack junto com as variaveis de
      # ambiente. E por isso que o shell tem `mode: json` no GITHUB_OUTPUT: sem
      # isso o jq quebra o JSON no meio das aspas.
      - name: Buscar o estado atual da stack
        id: stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          for v in PORTAINER_URL PORTAINER_API_KEY PORTAINER_STACK_ID PORTAINER_ENDPOINT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v ausente" >&2
              exit 1
            fi
          done

          BASE="${PORTAINER_URL%/}"
          AUTH="X-API-Key: ${PORTAINER_API_KEY}"

          echo "stack: ${PORTAINER_STACK_ID} (endpoint ${PORTAINER_ENDPOINT_ID})"

          curl -fsS -H "$AUTH" \
            "${BASE}/api/stacks/${PORTAINER_STACK_ID}/file?endpointId=${PORTAINER_ENDPOINT_ID}" \
            > stack-antes.json

          jq -r '.StackFileContent' stack-antes.json > stack.yml
          jq -c '.Env // []' stack-antes.json > env-antes.json

          # Confere que o arquivo veio com conteudo. Um corpo vazio aqui viraria
          # um PUT com StackFileContent vazio, e o Swarm removeria os servicos.
          if [ ! -s stack.yml ]; then
            echo "::error::StackFileContent veio vazio" >&2
            exit 1
          fi

          echo "linhas do compose: $(wc -l < stack.yml)"

      # As variaveis de ambiente da stack. O `.Env` do GET traz as que ja existem;
      # o filtro troca a tag das duas imagens e preserva o resto -- inclusive a
      # senha do Postgres e as credenciais de AI, que vivem la.
      #
      # Enviar o `.Env` inteiro e obrigatorio: se o PUT mandasse so as duas
      # tags, o Postgres subiria sem POSTGRES_PASSWORD.
      - name: Montar o payload
        id: payload
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          jq --arg core "registry.cloud.grupopw2c.com.br/chat-core:${BRANCH}" \
             --arg web  "registry.cloud.grupopw2c.com.br/chat-web:${BRANCH}" '
            map(
              if .Name == "OMNIA_CORE_IMAGE" then .Value = $core
              elif .Name == "OMNIA_WEB_IMAGE" then .Value = $web
              else .
              end
            )
          ' env-antes.json > env-final.json

          if ! jq -e 'map(select(.Name == "OMNIA_CORE_IMAGE")) | length > 0' \
            env-final.json >/dev/null; then
            echo "::warning::OMNIA_CORE_IMAGE nao estava na stack; as imagens vao usar o default do compose (latest)"
          fi

          jq -n --slurpfile s stack-antes.json --slurpfile e env-final.json '{
            StackFileContent: $s[0].StackFileContent,
            Env: $e[0],
            RepullImageAndRedeploy: true
          }' > payload.json

          echo "payload: $(wc -c < payload.json) bytes"
          echo "variaveis: $(jq 'length' < env-final.json)"

      - name: Atualizar a stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          BASE="${PORTAINER_URL%/}"

          STATUS=$(curl -sS -o resposta.json -w '%{http_code}' \
            --max-time 60 \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H 'Content-Type: application/json' \
            "${BASE}/api/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            --data-binary @payload.json || echo "000")

          case "$STATUS" in
            200|204)
              echo "stack atualizada (HTTP ${STATUS})"
              ;;
            *)
              echo "::error::API respondeu HTTP ${STATUS}" >&2
              cat resposta.json >&2 || true
              exit 1
              ;;
          esac

      # A API responde assim que o Swarm aceita a atualizacao -- as tasks ainda
      # estao subindo. Sem esta espera, o passo seguinte health-checkaria um
      # Core da versao anterior e dariia verde com o deploy pela metade.
      - name: Esperar as tasks subirem
        run: sleep 45

      # Confere pelo service, nao pela URL publica: em `mode: host` o Swarm
      # publica no node que roda a task, e a rota de entrada depende do balance.
      - name: Conferir o service no Swarm
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          BASE="${PORTAINER_URL%/}"
          AUTH="X-API-Key: ${PORTAINER_API_KEY}"

          curl -fsS -H "$AUTH" \
            "${BASE}/api/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            > stack-depois.json

          # Todo servico com mais de zero replicas tem que ter ao menos uma task
          # em execucao. Um servico preso em `Pending` explica por si so um
          # deploy que "rodou" e nao subiu nada.
          echo "--- servicos ---"
          jq -r '.Services[]? | "  \(.Spec.Name): \(.Spec.Mode.Replicated.Replicas // 0) replica(s)"' \
            stack-depois.json

          PENDING=$(jq '[.Services[]?.Spec.Mode.Replicated.Replicas // 0] | length' \
            stack-depois.json)

          echo "servicos declarados: ${PENDING}"

          echo
          echo "a API responde antes das tasks subirem. Para o estado real:"
          echo "  docker service ls --filter name=omnia_"
          echo "  docker service ps <servico> --no-trunc"

      - name: Resumo
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Deploy $BRANCH"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- chat-core: \`registry.cloud.grupopw2c.com.br/chat-core:${BRANCH}\`"
            echo "- chat-web: \`registry.cloud.grupopw2c.com.br/chat-web:${BRANCH}\`"
            echo
            echo "Reversao: aponte OMNIA_CORE_IMAGE e OMNIA_WEB_IMAGE para o sha."
          } >> "$GITHUB_STEP_SUMMARY"
