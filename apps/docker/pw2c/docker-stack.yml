version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnia}
      POSTGRES_USER: ${POSTGRES_USER:-omnia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .Env da stack}
    volumes:
      - omnia_postgres_data:/var/lib/postgresql/data
    networks:
      - omnia_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == compute01
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

  backend:
    image: ${OMNIA_BACKEND_IMAGE:-registry.cloud.grupopw2c.com.br/chat-back:latest}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:${CORE_PORT:-80}/health/live || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .Env da stack}
      POSTGRES_DB: ${POSTGRES_DB:-omnia}
      DATABASE_URL: postgresql://${POSTGRES_USER:-omnia_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .Env da stack}@postgres:5432/${POSTGRES_DB:-omnia}
      CORE_PORT: '80'
      AI_PROVIDER: ${AI_PROVIDER:-echo}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_TIMEOUT_MS: ${NVIDIA_TIMEOUT_MS:-300000}
      NVIDIA_MAX_TOKENS: ${NVIDIA_MAX_TOKENS:-400}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - omnia_net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == compute01
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s

  web:
    image: ${OMNIA_WEB_IMAGE:-registry.cloud.grupopw2c.com.br/chat-web:latest}
    ports:
      - target: 80
        published: ${OMNIA_WEB_PORT:-8080}
        protocol: tcp
        mode: host
    networks:
      - omnia_net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == compute01
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s

volumes:
  omnia_postgres_data:

networks:
  omnia_net:
    driver: overlay
    attachable: true
