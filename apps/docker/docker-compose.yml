services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnia
      POSTGRES_USER: omnia_user
      POSTGRES_PASSWORD: ${omniabanco2026}
    ports:
      - '5433:5432'
    volumes:
      - omnia_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnia_user -d omnia']
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
    container_name: omnia-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://omnia_user:${omniabanco2026}@postgres:5432/omnia
    restart: 'no'

volumes:
  omnia_postgres_data:
