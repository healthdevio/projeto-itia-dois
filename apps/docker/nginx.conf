# Nginx da interface: serve o bundle do Vite e faz proxy de /api para o Core.
#
# O Core NÃO deve ser exposto na internet. Ele confia no header cru X-User-Id
# (apps/chat-core/README.md): qualquer cliente pode impersonar outro usuário.
# Precisa de um proxy na frente que valide token e reescreva o header.
#
# SSL/TLS: Em produção, o SSL termina no Load Balancer / Ingress (Traefik, Traefik, HAProxy, Cloudflare, etc.)
# e o tráfego chega aqui via HTTP (porta 80). Se precisar terminar SSL no nginx,
# descomente o bloco server 443 e monte os certificados via volume.

# HTTP -> HTTPS redirect (opcional, se SSL termina no nginx)
# server {
#   listen 80;
#   server_name projeto-itia-dois.cloud.grupopw2c.com.br;
#   return 301 https://$server_name$request_uri;
# }

# HTTP server (principal - recebe tráfego do Load Balancer/Ingress)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O resolver cobre o Core ainda não ter subido: o nginx fica pronto antes dele.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/ {
    set $core_upstream http://core:3001;

    proxy_pass $core_upstream$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O provider Nvidia tem teto de 5 min (NVIDIA_TIMEOUT_MS). Cortar antes
    # devolve erro no meio da digitação, no lugar da resposta que está a caminho.
    proxy_connect_timeout 10s;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;

    # Sem isso o nginx segura a resposta até completar o buffer e o streaming
    # não acontece.
    proxy_buffering off;
  }

  # Nome com hash no nome é imutável por construção.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Health check: proxy para o Core (para o frontend saber se a API está viva)
  location /health {
    set $core_upstream http://core:3001;

    proxy_pass $core_upstream/health;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout curto: health check deve ser rápido
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    # Sem buffering: resposta imediata
    proxy_buffering off;

    # Cache zero: health check deve ser sempre fresco
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # SPA: rota sem arquivo cai no index.html para o roteamento do cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Nunca cacheado: é ele que aponta para os assets com hash.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;
}

